---
name: Release
env:
  REGISTRY: quay.io/ibotty
  IMAGE_NAME: smtp-s3-dump

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  check-ci:
    name: Look for a passing CI run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.runs.outputs.passed }}
    steps:
    - id: runs
      run: |
        echo "passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId,event --jq '[.[] | select(.event != "schedule")] | length')" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

  ci:
    needs: check-ci
    if: ${{ needs.check-ci.outputs.passed == '0' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release binary
    needs: [check-ci, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
    - run: cargo build --locked --release --all-features
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-bin
        path: target/release/smtp-s3-dump
        retention-days: 1

  github-release:
    name: Create GitHub release
    needs: build
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-bin
        path: target/release

    - name: Create tarball
      run: |
        staging="$(basename "$GITHUB_REPOSITORY")-$GITHUB_REF_NAME"
        mkdir -p "$staging"
        cp README.md LICENSE "$staging"
        install -m 755 target/release/smtp-s3-dump "$staging"
        tar czf "$staging.tar.gz" "$staging"
        sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
        echo "ASSETS=$staging.tar.gz $staging.tar.gz.sha256" >> "$GITHUB_ENV"

    - name: Create GitHub release
      run: gh release create "$GITHUB_REF_NAME" $ASSETS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build and push container
    needs: build
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-bin
        path: target/release

    # upload-artifact drops the executable bit; restore it before COPY.
    - run: chmod +x target/release/smtp-s3-dump

    - name: Log into registry
      uses: redhat-actions/podman-login@4c93cb1ea36b10156ea541570dc69bc04dffe10e # v1.1.2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Get version from Cargo.toml
      id: version
      run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

    - name: Build container
      id: build-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: "${{ github.ref_name }} latest"
        archs: amd64
        oci: true
        containerfiles: ./Containerfile
        build-args: |
          VERSION=${{ steps.version.outputs.version }}

    - name: Push to registry
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ${{ env.REGISTRY }}
